# 比邻远程（BiLin）iOS 构建。手动触发：Actions → BiLin iOS build → Run workflow，
# 或 API: POST /repos/{owner}/{repo}/actions/workflows/bilin-ios.yml/dispatches
# 产物（Artifacts）：bilin-ios-ipa  未签名的 BiLin-<版本>.ipa
#   有苹果开发者账号前：用 Sideloadly 等工具以自己的 Apple ID 重签后装到 iPhone（7 天有效）
#   有账号后：再加签名和上传 TestFlight 的步骤
# 基于上游 .github/workflows/flutter-build.yml 的 build-rustdesk-ios。
name: BiLin iOS build

on:
  workflow_dispatch:
    inputs:
      bilin_version:
        description: "比邻远程版本号"
        required: false
        default: "0.6.0"

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  BILIN_VERSION: "${{ inputs.bilin_version || '0.6.0' }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-ios:
    needs: [generate-bridge]
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: brew install nasm yasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; tail -80 "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bilin-lib-cache-ios
          key: aarch64-apple-ios

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build rustdesk lib
        run: cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: Build ipa (unsigned)
        shell: bash
        run: |
          cd flutter
          N=$(echo $BILIN_VERSION | awk -F. '{print $1*10000+$2*100+$3}')
          flutter build ipa --release --no-codesign --build-name "$BILIN_VERSION" --build-number "$N"
          APP=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "../BiLin-$BILIN_VERSION.ipa" Payload
          ls -la "../BiLin-$BILIN_VERSION.ipa"

      - name: Upload ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bilin-ios-ipa
          path: BiLin-*.ipa
          retention-days: 30
