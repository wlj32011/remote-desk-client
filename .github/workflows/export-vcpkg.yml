# 把 bilin-windows.yml 缓存的 vcpkg 编译结果（x64-windows-static）导出成 Artifact，给本地 Windows 机器（B）直接用。
name: Export vcpkg cache

on:
  workflow_dispatch:

env:
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  export:
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore vcpkg installed
        id: vcpkgcache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json') }}
          fail-on-cache-miss: true

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vcpkg-installed-x64-windows-static
          path: C:\vcpkg\installed
          retention-days: 30
